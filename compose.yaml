# Forge CONTROL PLANE (developer/orchestration runtime), single-app layout.
#
# (No explicit `name:` — the Compose project name defaults to THIS directory's
#  name, so every clone gets its own isolated control-plane instance. The
#  canonical scaffolding names it `<APP>-forge`; a template clone inherits the
#  directory name instead, which does the same isolation without a placeholder.)
#
# This starter has no platform source of its own — it points the control plane at
# THIS directory as the workspace (the app lives under ./app,
# FORGE_APP_LAYOUT=single) and hands it the host Docker socket so Capabilities can
# run app work in Docker (Docker-out-of-Docker). The control-plane image carries the
# Forge runtime + Docker CLI; the slimmer DATA PLANE image is used for production.
#
# FORGE_SECRETS_KEY is REQUIRED — the control plane refuses to start without it.
# Set it in a local, gitignored `.env` (docker compose auto-loads it); see `.env.example`.
services:
  api:
    image: ghcr.io/mardash-ai/forge-control-plane:1.55.0
    ports: ["127.0.0.1:3717:3717"]
    environment:
      - PORT=3717
      - FORGE_APP_LAYOUT=single
      - FORGE_WORKSPACE=${PWD}
      - FORGE_STATE_DIR=${PWD}/.forge
      - FORGE_SECRETS_KEY=${FORGE_SECRETS_KEY:-}
      - FORGE_DATA_PLANE_IMAGE=ghcr.io/mardash-ai/forge-data-plane:1.55.0
      - FORGE_PLATFORM_STORE=postgres
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Talk to the host Docker daemon (Docker-out-of-Docker).
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount this project at the SAME absolute path host==container so nested
      # `docker compose` (run by Capabilities) resolves app bind-mounts on the
      # host daemon. Do not change this symmetry.
      - ${PWD}:${PWD}
    working_dir: /forge
    restart: unless-stopped
