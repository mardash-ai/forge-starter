name: Publish app image

# Builds & publishes your app's PRODUCTION image (Next.js standalone, slim) to GHCR once you have
# an `app/` with a Dockerfile (copy deploy/app-image/* into app/ — see DEPLOY.md). Continuous:
#   - push to main       -> :latest and :sha-<short>
#   - push a version tag -> :X.Y.Z
# Multi-arch (linux/amd64 + linux/arm64). The image name is ghcr.io/<owner>/<repo>.
# Skips itself on the bare template (no app/Dockerfile), so this repo stays green.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gate on app/Dockerfile
        id: gate
        run: |
          if [ -f app/Dockerfile ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "No app/Dockerfile yet — skipping (template repo)."; fi
      - if: steps.gate.outputs.go == 'true'
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - if: steps.gate.outputs.go == 'true'
        name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - if: steps.gate.outputs.go == 'true'
        name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.gate.outputs.go == 'true'
        name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
      - if: steps.gate.outputs.go == 'true'
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
