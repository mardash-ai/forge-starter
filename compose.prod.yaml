# PRODUCTION stack for a Forge app — the app + (optionally) a Forge data-plane sidecar +
# Postgres, served behind a shared Traefik reverse proxy. Deployed with ZERO DOWNTIME by the
# Forge `Deploy` capability: `make deploy` → `./forge deploy` rolls the public `web` service
# start-first (new replica up + healthy before the old drains out of the proxy). See DEPLOY.md.
#
# This is env-parameterized: copy .env.prod.example → .env and set the values there — you should
# not need to edit this file. Remove the `postgres` / `data-plane` services if your app doesn't
# use them (and drop their env + `depends_on`).
name: ${APP_NAME:-myapp}-prod

services:
  web:
    image: ${APP_IMAGE:-ghcr.io/your-org/your-app:latest}
    pull_policy: missing
    restart: unless-stopped
    # Let in-flight requests finish on SIGTERM before SIGKILL so the roll drains cleanly.
    stop_grace_period: 15s
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Next.js standalone must bind 0.0.0.0 or Traefik gets a 502 (set in the image too).
      - HOSTNAME=0.0.0.0
      # Derived from POSTGRES_PASSWORD so the app + Postgres can never disagree (a mismatched
      # DATABASE_URL is a classic 28P01). Remove if your app has no database.
      - DATABASE_URL=postgres://forge:${POSTGRES_PASSWORD:-forge}@postgres:5432/${DB_NAME:-myapp}
      # Deploy-time secrets — empty degrades gracefully (source from a real secret store in prod).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [proxy, internal]
    # Traefik ingress (no host port published — Traefik reaches the container over `proxy`).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-myapp}.rule=Host(`${APP_HOST:-myapp.example.com}`)"
      - "traefik.http.routers.${APP_NAME:-myapp}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-myapp}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME:-myapp}.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      # Health-gating: Traefik only routes to a replica once it passes /api/health — this is
      # what makes `forge deploy`'s start-first roll zero-downtime. Point .path at your health route.
      - "traefik.http.services.${APP_NAME:-myapp}.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.${APP_NAME:-myapp}.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.${APP_NAME:-myapp}.loadbalancer.healthcheck.timeout=3s"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Forge DATA-PLANE sidecar — the runtime capabilities the app needs (scheduler C2, secrets C5),
  # calling back into `web` over `internal`. Slim image, not exposed to Traefik. Remove if unused.
  data-plane:
    image: ${FORGE_DATA_PLANE_IMAGE:-ghcr.io/mardash-ai/forge-data-plane:0.11.0@sha256:0528e92059e2871dc1382aa43fb0fb32979349e3d2d0b82b96fd17c7ba2dda89}
    pull_policy: missing
    restart: unless-stopped
    environment:
      - PORT=3718
      - FORGE_STATE_DIR=/state
      - FORGE_APP_NAME=${APP_NAME:-myapp}
      - FORGE_APP_CALLBACK_HOST=web
      - FORGE_APP_CALLBACK_PORT=3000
      - FORGE_SECRETS_KEY=${FORGE_SECRETS_KEY:-}
      - FORGE_JOBS_FILE=/config/jobs.json
      - FORGE_SCHEDULER_TICK_MS=${FORGE_SCHEDULER_TICK_MS:-}
    volumes:
      - forge_state:/state
      - ./deploy/jobs.json:/config/jobs.json:ro
    depends_on:
      web:
        condition: service_started
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=forge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-forge}
      - POSTGRES_DB=${DB_NAME:-myapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      # Name the DB — user `forge` != db `${DB_NAME}`, else a bare `pg_isready -U forge` spams
      # FATAL "database forge does not exist" every interval.
      test: ["CMD-SHELL", "pg_isready -U forge -d ${DB_NAME:-myapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  forge_state:

networks:
  internal:
  # External network created by your Traefik stack. Start it first, or `up` fails
  # "network proxy not found".
  proxy:
    external: true
